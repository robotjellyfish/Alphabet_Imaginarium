<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unicode Glyph Scrambler</title>
<style>
    :root {
        --bg: #121212;
        --surface: #1e1e1e;
        --border: #333;
        --text: #e0e0e0;
        --accent: #bb86fc;
    }
    body {
        font-family: system-ui, -apple-system, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .container {
        width: 100%;
        max-width: 800px;
        background: var(--surface);
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    textarea {
        width: 100%;
        height: 150px;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1rem;
        font-size: 1.2rem;
        resize: vertical;
        box-sizing: border-box;
        margin-bottom: 1rem;
    }
    #output {
        min-height: 150px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1rem;
        font-size: 1.5rem;
        word-break: break-all;
        white-space: pre-wrap;
        margin-bottom: 1rem;
    }
    .controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    button {
        background: var(--accent);
        color: #000;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
        transition: opacity 0.2s;
    }
    button:hover {
        opacity: 0.8;
    }
    .disclaimer {
        font-size: 0.8rem;
        color: #888;
        margin-top: 1rem;
        text-align: center;
    }
</style>
</head>
<body>

<div class="container">
    <h2>Unicode Glyph Scrambler</h2>
    <textarea id="input" placeholder="Type text here..."></textarea>
    <div id="output"></div>
    <div class="controls">
        <button id="copyBtn">Copy to Clipboard</button>
    </div>
    <div class="disclaimer">
        Disclaimer: Heavy reliance on structural unicode replacement inherently breaks screen reader accessibility. 
    </div>
</div>

<script>
const dict = {
    'A': ['🇦','⟑','Ꭿ','ᐂ','ᕔ','ꪇ','ឝ','𔓬','𔕧','Ⲁ','ꛡ','𖬖','𐒷','₳','𖧫','𖨁','𖤬','⎁','ǟ','ᦧ','𖤂','𐐨','𐐀','𐋎','𖹬','𝚨','𐌀','𑃢','⎀','⎃','ᗩ','ᗋ','ᤂ','ꅔ','ձ','ꋬ','𐀁','𝜜','𝙰','𝔸','𝕬','𝓐','𝗔','𝐀','⛦','✡','✯','⚝','✮','⟁','⨇','Ⱑ','ꗇ','ꕔ','ꕖ'],
    'B': ['🇧','𝄡','ᏸ','ਊ','♭','ᣡ','𐇝','Ხ','ᖲ','ᗷ','ᙟ','ੳ','ᛔ','Ⱐ','ꞗ','𝚩','𝗕','ℬ','𝕭','𝔹','𝙱','𝐁'],
    'C': ['🇨','☪','ꘚ','𝄵','☽','☾','⚸','⩻','𝓒','Ꮸ','ᕳ','₡','⸿','ꮳ','ᕳ','⍧','𔗏','𐃗','∁','Ꮳ','∁','𐓆','𐒨','𐙠','𐘳','᥋','𐚓','𞄦','ᥫ','ʗ','ල','င','℃','🄯','𐀲','₵','𝙲','ℂ','𝕮','𝓒','𝗖','𝐂'],
    'D': ['🇩','D','𞤯','ↁ','𝛛','ԃ','Ԃ','ᖱ','ᗟ','ᗠ','ᗥ','ᗬ','🆥','ᶑ','₫','𝗗','𝓓','𝕯','𝔻','𝙳','𝐃'],
    'E': ['🇪','ℇ','Ⱕ','𖭴','𖧏','؏','Ꮛ','ܧ','∈','𐒢','ᳯ','𖡄','℮','𖹏','𝛠','𖮀','𞄑','㉫','ᕮ','ᙓ','ᘿ','⍷','Ꜫ','ꫀ','𝙴','𝔼','𝕰','ℰ','𝗘','𝐄','𐜲'],
    'F': ['🇫','𐜴','🝡','𞅃','𝟋','𝟊','℉','𐝦','Ƒ','Ꝼ','𐅿','𑢢','𝗙','ℱ','𝕱','𝔽','𝙵','𝐅','𐜱'],
    'G': ['🇬','₲','𖤯','G','Ǥ','Ᏽ','ꮹ','𖣷','𖥨','𖧣','ڨ','Ჭ','Ɡ','ꁅ','ဌ','Ⴚ','ૹ','𝙶','𝔾','𝓖','𝗚','𝐆','𝄞'],
    'H': ['🇭','ℏ','ⴼ','﷼','ꕑ','𖦙','𐪘','𐒅','₶','ɧ','ᦩ','Ჩ','𖭝','𖭜','Ⱗ','ƕ','Ƕ','೫','ᚻ','♄','អ','𑢥','𝗛','ℋ','𝕳','ℍ','𝙷','𝐇'],
    'I': ['🇮','☤','⚕','⚚','𔕉','𖣇','႞','ⅈ','⑄','🜌','ꖔ','ꔀ','𝙸','𝕀','𝕴','ℐ','𝗜','𝐈'],
    'J': ['🇯','ʝ','𐫌','ᣱ','ჯ','ڸ','❡','𖥢','𖹅','𑆆','၂','𝗝','𝓙','𝕵','𝕁','𝙹','𝐉'],
    'K': ['🇰','㉿','ꗣ','ƙ','₭','𝙺','𝕂','𝕶','𝓚','𝗞','𝐊'],
    'L': ['🇱','Ꮭ','╚','𝖑','𑴂','𐤋','𖼙','𖺚','𞋎','𝗟','ℒ','𝕷','𝕃','𝙻','𝐋'],
    'M': ['🇲','Ⱞ','𑇥','𖢑','𐎠','𖬷','𖥯','ᦦ','ᗰ','ᙏ','𐀢','ଳ','ന','ᛖ','ꢭ','𝙼','𝕄','𝕸','𝓜','𝗠','𝐌'],
    'N': ['🇳','𝛞','🜶','᮷','ꤲ','𝝶','𐭇','𑫍','𝛮','𖬃','𐰇','𐰵','ꦺ','᧟','᱅','ᴻ','ꤾ','𞄂','ᕱ','ꘐ','₦','ꖧ','ꖦ','𝗡','𝓝','𝕹','ℕ','𝙽','𝐍'],
    'O': ['🇴','ꬾ','ۃ','ꮻ','ᴓ','᪤','⥀','⥁','꩜','Ѻ','ѻ','𐌈','Ꙫ','Ꚛ','𝛗','⛞','⚆','◍','⟲','⟳','⨀','Ⱉ','Ⱒ','႐','⌀','∅','⍉','⌾','⍬','𞋇','𞋯','❍','𝙾','𝕆','𝕺','𝓞','𝗢','𝐎','𖥞','𖣐','𖥕','☸','𖤓','𖥚','🜚','ၜ','⦿','⚙','⛯','⛮','⛭','ꗞ','ꗝ','ꖴ','✇','☢','❂','♾','☯','☮','🜜','⦲','⍟'],
    'P': ['🇵','℘','⅌','𖡮','ᖰ','ᕵ','🆊','Ƿ','ק','₱','𝗣','𝓟','𝕻','ℙ','𝙿','𝐏','☭'],
    'Q': ['🇶','ᖳ','ᕴ','ꝙ','Ꝗ','ꪋ','𝚀','ℚ','𝕼','𝓠','𝗤','𝐐'],
    'R': ['🇷','𐙕','℞','🜆','☈','𐦝','ᚱ','ꮢ','ꮉ','Ʀ','Ꮢ','𐒴','ᖆ','ᖇ','₹','𐍂','ᗁ','ꋪ','Ꞟ','𝗥','ℛ','𝕽','ℝ','𝚁','𝐑'],
    'S': ['🇸','Ꭶ','ڱ','န','ܨ','ꭶ','🅍','ៜ','ᰧ','ᳱ','ꢻ','𖬺','𖠏','𐔣','ᣵ','𖹋','𖬺','ꍛ','𑂘','ᣵ','Ֆ','ន','ꂢ','𑣮','ꗟ','ꗏ','ꕷ','𝚂','𝕊','𝕾','𝓢','𝗦','𝐒'],
    'T': ['🇹','☦','☥','🜏','༒','𑇍','𖭪','𖣁','ⴕ','🜋','⌖','ᡶ','᛭','₸','♱','♰','𝗧','𝓣','𝕋','𝚃','𝐓','𐜭'],
    'U': ['🇺','ᥩ','᮵','℧','ᕰ','🅄','𑢹','𝚄','𝕌','𝖀','𝓤','𝗨','𝐔','𓋧'],
    'V': ['🇻','ꮙ','℣','✔','⛛','🜉','🝢','⨈','𝓥','𝗩','𝕍','𝚅','𝐕','⛧'],
    'W': ['🇼','ꮤ','ꮿ','ᗯ','⍦','🅆','ש','♆','𔓢','𔒾','ധ','ሠ','យ','⍹','Ⱎ','𐌸','𝚆','𝕎','𝖂','𝒲','𝗪','𝐖'],
    'X': ['🇽','᯼','𝄋','𖣘','𓌖','𖹓','✗','᰾','᰽','※','🅇','א','⚔','⚒','⏧','𔕂','𖠄','✘','𝚇','𝕏','𝖃','𝓧','𝐗','☠'],
    'Y': ['🇾','𐒋','𐔤','Ყ','Ⴤ','🅈','𐂨','𝚈','𝕐','𝖄','𝒴','𝗬','𝐘'],
    'Z': ['🇿','𐄺','𔗨','₴','Ꙃ','𐓓','႗','𖹃','Ⴭ','ᤁ','🅉','𑢳','𝚉','𝕫','𝓩','𝗭','𝐙']
};

const ligatures = {
    'LE': ['ᇉ','ꡬ'], 'AS': ['⅍'], 'IA': ['ⷼ','ꙗ','Ꙗ'], 'OE': ['ꟹ'], 
    'CO': ['ꥠ','㏇'], 'OC': ['ꥰ'], 'EE': ['ꥹ'], 'CE': ['ퟔ'], 
    'DEF': ['≝'], 'OY': ['ѹ'], 'NN': ['ꉆ'], 'MR': ['🅬'], 
    'IE': ['ꍠ'], 'NO': ['ꍸ','ᢚ','ꂚ','№'], 'US': ['␟'], 
    'CAN': ['␘'], 'LOG': ['㏒'], 'IN': ['㏌'], 'MIL': ['㏕'], 
    'MOL': ['㏖'], 'PH': ['㏗'], 'RAD': ['㎭'], 'EV': ['㋎'], 
    'BAR': ['㍴'], 'ERG': ['㋍'], 'EA': ['ణ'], 'MM': ['ဣ'], 
    'IL': ['𔖵'], 'ONE': ['ꆛ'], 'IT': ['𐜛','𔕺','𔕛'], 'BE': ['Ⱘ'], 
    'DA': ['㍲'], 'AU': ['㍳','ꜷ'], 'OV': ['㍵','Ꭽ'], 'MS': ['㎳'], 
    'NS': ['㎱'], 'PA': ['㎩'], 'NA': ['㎁'], 'AM': ['㏂','𐅗'], 
    'MA': ['㎃'], 'KA': ['㎄'], 'HO': ['ꀞ'], 'TH': ['𑠓'], 
    'IS': ['ꡑ'], 'THE': ['𐅮'], 'IC': ['𔖶'], 'DC': ['𝄊'], 
    'DS': ['𝄉'], 'PED': ['𝆮'], 'TR': ['𝆖'], 'TO': ['ʨ'], 
    'SO': ['␎'], 'HE': ['𐅒'], 'ER': ['𐧳'], 'SS': ['🅍'], 'ME': ['𐅖']
};

const ligatureKeys = Object.keys(ligatures).sort((a, b) => b.length - a.length);

function getUnicodeBlock(char) {
    return char.codePointAt(0) >> 8; // Group by 256-code-point boundaries
}

function isSymbol(char) {
    const cp = char.codePointAt(0);
    return (cp >= 0x2000 && cp <= 0x2BFF) || // Misc Symbols, Dingbats, Arrows, etc.
           (cp >= 0x2600 && cp <= 0x27BF) || // Misc Dingbats
           (cp >= 0x1F000 && cp <= 0x1FAFF)|| // Emojis, Pictographs, Alchemical
           (cp >= 0x2E00 && cp <= 0x2E7F);   // Supplemental Punctuation
}

function scramble(text) {
    let result = "";
    let bufferBlocks = [];
    let i = 0;

    while (i < text.length) {
        let matchedLigature = false;
        
        for (let seq of ligatureKeys) {
            if (text.substring(i, i + seq.length).toUpperCase() === seq) {
                const options = ligatures[seq];
                result += options[Math.floor(Math.random() * options.length)];
                i += seq.length;
                matchedLigature = true;
                break;
            }
        }

        if (!matchedLigature) {
            let char = text[i].toUpperCase();
            if (dict[char]) {
                let validGlyphs = dict[char].filter(g => 
                    isSymbol(g) || !bufferBlocks.includes(getUnicodeBlock(g))
                );

                if (validGlyphs.length === 0) validGlyphs = dict[char]; // Fallback to avoid dead ends

                let chosen = validGlyphs[Math.floor(Math.random() * validGlyphs.length)];
                result += chosen;

                if (!isSymbol(chosen)) {
                    bufferBlocks.push(getUnicodeBlock(chosen));
                    if (bufferBlocks.length > 2) bufferBlocks.shift();
                }
            } else {
                result += text[i];
            }
            i++;
        }
    }
    return result;
}

const inputEl = document.getElementById('input');
const outputEl = document.getElementById('output');
const copyBtn = document.getElementById('copyBtn');

inputEl.addEventListener('input', (e) => {
    outputEl.textContent = scramble(e.target.value);
});

copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(outputEl.textContent).then(() => {
        const originalText = copyBtn.textContent;
        copyBtn.textContent = 'Copied!';
        setTimeout(() => { copyBtn.textContent = originalText; }, 1500);
    });
});
</script>
</body>
</html>
